          <h1>SAIR Competitions</h1>
          <p><strong>Open mathematical and AI discovery challenges.</strong></p>
          <p>SAIR runs open competitions at the frontier of mathematics and machine reasoning. Anyone can take part — results and leaderboards live on each challenge page.</p>
          <h2>Challenges</h2>
          <ul>
            <li>
              <a href="https://competition.sair.foundation/competitions/igp24">Inverse Galois Problem (IGP24)</a> — A mathematical discovery challenge: help expand the known map of degree-24 equations
              (the Inverse Galois Problem in Degree 24) and their hidden symmetries. <a href="https://competition.sair.foundation/competitions/igp24.md">Full rules (Markdown)</a>.
            </li>
            <li>
              <a href="https://competition.sair.foundation/competitions/modular-arithmetic-challenge">Modular Arithmetic Challenge</a> — Can a neural network learn to compute (a × b) mod p for
              integers hundreds of digits long? An open probe of where exact machine reasoning breaks down.
              <a href="https://github.com/SAIRcompetition/modular-arithmetic-challenge">Full rules &amp; code (GitHub)</a>.
            </li>
            <li>
              <a href="https://competition.sair.foundation/competitions/mathematics-distillation-challenge-equational-theories-stage1"
                >Mathematics Distillation Challenge — Equational Theories (Stage 1)</a
              >
              — Submit a single knowledge prompt that guides an LLM to decide whether one equation implies another. The prompt must include placeholders for Equation 1 and Equation 2 so each
              evaluation problem can be inserted automatically. SAIR's first competition, announced by Terence Tao.
              <a href="https://github.com/SAIRcompetition/equational-theories-stage1-judge">Code &amp; judge (GitHub)</a>.
            </li>
            <li>
              <a href="https://competition.sair.foundation/competitions/mathematics-distillation-challenge-equational-theories-stage2"
                >Mathematics Distillation Challenge — Equational Theories (Stage 2)</a
              >
              — Submit a solver that, for each pair of equations, produces a machine-verified Lean 4 certificate (a proof when one implies the other, or a finite magma counterexample), adjudicated by
              a deterministic Lean judge.
              <a href="https://github.com/SAIRcompetition/equational-theories-lean-stage2">Lean solver &amp; judge (GitHub)</a>.
            </li>
          </ul>
